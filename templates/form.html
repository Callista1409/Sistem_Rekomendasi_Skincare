<!-- templates/form.html -->

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data Kulit - GlowMatch</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdf6f9, #f4f8ff);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .top-right {
      position: absolute;
      top: 30px;
      right: 40px;
      display: flex;
      gap: 10px;
    }

    .profile-btn {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .profile-btn:hover {
      transform: scale(1.05);
    }

    .history-btn {
      height: 52px;
      padding: 0 16px;
      background: rgba(255,255,255,0.9);
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 14px;
      color: #b76e79;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .history-btn:hover {
      transform: translateY(-1px);
    }

    .card {
      width: 100%;
      max-width: 580px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.6);
    }

    h2 {
      text-align: center;
      font-size: 30px;
      color: #2d2d2d;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fff;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #d9a7c7;
      box-shadow: 0 0 0 4px rgba(217,167,199,0.12);
    }

    small {
      display: block;
      margin-top: 6px;
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d9a7c7, #fffcdc);
      color: #444;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(201,123,141,0.15);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(201,123,141,0.2);
    }
  </style>
</head>
<body>

  <div class="top-right">
    <a href="/history" class="history-btn">History</a>
    <a href="/profile" class="profile-btn">👤</a>
  </div>

  <div class="card">
    <h2>Input Kondisi Kulit</h2>

    <p class="subtitle">
      Isi data berikut untuk mendapatkan rekomendasi skincare terbaik
    </p>

    <form action="/predict" method="POST">

      <label>Age</label>
      <input type="number" name="age" required>

      <label>Gender</label>
      <select name="gender">
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Hydration Level</label>
      <select name="hydration">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>

      <label>Oil Level</label>
      <select name="oil">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>

      <label>Sensitivity</label>
      <select name="sensitivity">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>

      <label>Humidity</label>
      <input type="number" step="0.1" name="humidity" required>
      <small>
        Kelembaban udara (%) mempengaruhi kondisi kulit terutama minyak dan hidrasi.
      </small>

      <label>Temperature</label>
      <input type="number" step="0.1" name="temperature" required>
      <small>
        Suhu lingkungan (°C) dapat memengaruhi produksi minyak pada kulit.
      </small>

      <button type="submit">
        Rekomendasikan Sekarang
      </button>

    </form>
  </div>

</body>
</html>
