<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Rekomendasi</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdf6f9, #f4f8ff);
      min-height: 100vh;
      padding: 50px 30px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #2d2d2d;
    }

    .skin-type {
      font-size: 18px;
      color: #666;
      margin-bottom: 40px;
    }

    .skin-type span {
      color: #c97b8d;
      font-weight: 600;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .card {
      width: 300px;
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .product-name {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d2d;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      background: #fff4f8;
      color: #c97b8d;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .desc {
      font-size: 14px;
      color: #666;
      margin: 8px 0;
    }

    .price {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #b76e79;
    }
  </style>
</head>
<body>

  <h1>Hasil Rekomendasi</h1>

  <div class="skin-type">
    Tipe Kulit Kamu: <span>{{ skin_type }}</span>
  </div>
  <div class="skin-type">
    Concern Dominan: <span>{{ concern }}</span>
  </div>

  <div class="container">
    {% for product in products %}
    <div class="card">

      <!-- NAMA PRODUK -->
      <div class="product-name">
        {{ product.product_name }}
      </div>

      <!-- KATEGORI -->
      <div class="category">
        {{ product.routine_step }} - {{ product.category }}
      </div>

      <!-- CONCERN -->
      <div class="desc">
        Concern: {{ product.concern }}
      </div>

      <!-- SKIN TYPE -->
      <div class="desc">
        Skin Type: {{ product.skin_type }}
      </div>

      <!-- PRICE -->
      <div class="price">
        {{ product.price }}
      </div>

    </div>
    {% endfor %}
  </div>

</body>
</html>
