<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - GlowMatch</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdf6f9, #f4f8ff);
            min-height: 100vh;
            color: #2d2d2d;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #b76e79;
            letter-spacing: 1px;
        }

        .profile-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: 1px solid #d9b6be;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(183,110,121,0.12);
            transition: 0.3s;
        }

        .profile-icon:hover {
            transform: scale(1.05);
            background: white;
        }

        /* CARD */
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            color: #2d2d2d;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .info-box {
            background: #fff;
            border: 1px solid #f0dbe1;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .info-box p {
            font-size: 16px;
            margin-bottom: 14px;
            color: #444;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .label {
            font-weight: 600;
            color: #c97b8d;
        }

        .btn-group {
            margin-top: 35px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn-back {
            background: rgba(255,255,255,0.8);
            border: 1px solid #d9b6be;
            color: #b76e79;
        }

        .btn-back:hover {
            background: white;
            box-shadow: 0 8px 20px rgba(183,110,121,0.12);
        }

        .btn-logout {
            background: linear-gradient(135deg, #d9a7c7, #fffcdc);
            color: #444;
            box-shadow: 0 12px 30px rgba(201,123,141,0.15);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px rgba(201,123,141,0.2);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">GlowMatch</div>

        <a href="/profile" class="profile-icon">
            👤
        </a>
    </div>

    <!-- CONTENT -->
    <div class="container">
        <div class="card">

            <h1>Profil Akun</h1>
            <p class="subtitle">
                Informasi akun yang sedang login
            </p>

            <div class="info-box">
                <p>
                    <span class="label">Username:</span>
                    {{ username }}
                </p>

                <p>
                    <span class="label">Email:</span>
                    {{ email }}
                </p>
            </div>

            <div class="btn-group">
                <a href="/form" class="btn btn-back">
                    ← Kembali ke Form
                </a>

                <a href="/logout" class="btn btn-logout">
                    Logout
                </a>
            </div>

        </div>
    </div>

</body>
</html>
