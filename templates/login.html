<!-- templates/login.html -->

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GlowMatch</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdf6f9, #f4f8ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.6);
    }

    h2 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
      color: #2d2d2d;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #d9a7c7;
      box-shadow: 0 0 0 4px rgba(217,167,199,0.12);
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d9a7c7, #fffcdc);
      color: #444;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(201,123,141,0.15);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .bottom-text {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .bottom-text a {
      color: #c97b8d;
      text-decoration: none;
      font-weight: 600;
    }

    .error {
      margin-top: 14px;
      color: #b3475f;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome Back ✨</h2>

    <p class="subtitle">
      Login untuk melanjutkan rekomendasi skincare terbaikmu
    </p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <button type="submit">
        Login Sekarang
      </button>

    </form>

    <div class="bottom-text">
      Belum punya akun?
      <a href="/register">Daftar di sini</a>
    </div>
  </div>

</body>
</html>
